# Spring Boot application properties

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/blogdb
spring.datasource.username=dbuser
spring.datasource.password=dbpassword

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update # For development: create or update schema. Use 'validate' or 'none' for production.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true # Show SQL queries in logs, useful for development
spring.jpa.open-in-view=false # Explicitly disable Open Session in View to avoid performance issues and encourage service layer data fetching

# Optional: Logging level for Hibernate
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# For file uploads (if needed later, these are placeholders)
# spring.servlet.multipart.max-file-size=10MB
# spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=yourdifficulttoguessjwtsecretkeyplaceholderdontuseinprod
app.jwt.expiration-ms=86400000 # 24 hours
# app.jwt.refreshExpirationMs=604800000 # 7 days (for refresh token if implemented)
